name: Weekly Price Sync

on:
  schedule:
    # 每週一 01:00 UTC = 台北時間 09:00
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/fetch-prices.mjs

      - id: diff
        run: |
          if git diff --quiet -- content.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git commit -m "價格自動更新（$(TZ=Asia/Taipei date +%Y-%m-%d)）"
          git push

      # GITHUB_TOKEN 推的 commit 不會觸發 deploy.yml，要明確呼叫一次
      - name: Trigger deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
